name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Lua interpreter
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Require Lua interpreter
        run: command -v lua5.4
      - name: Run validation without pack build
        env:
          LUA: lua5.4
        run: python script/ci/verify.py --skip-pack
