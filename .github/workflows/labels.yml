name: 自动标签 / Labels

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  ensure:
    name: 初始化标签 / Ensure labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: 创建或更新标签 / Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python script/ci/ensure_labels.py

  issue:
    name: 标记与指派 Issue / Triage Issue
    if: github.event_name == 'issues'
    needs: ensure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: 标记类型与指派 / Label and assign
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python script/ci/issue_triage.py --event-file "$GITHUB_EVENT_PATH"

  paths:
    name: 标记 PR 文件范围 / Label PR paths
    if: github.event_name == 'pull_request_target'
    needs: ensure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true
      - name: 指派与请求审查 / Assign and request review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python script/ci/pr_triage.py --event-file "$GITHUB_EVENT_PATH"
