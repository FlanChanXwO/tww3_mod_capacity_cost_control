name: 功能请求 / Feature request
description: 提出功能或改进建议。 / Suggest a feature or improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述 / Feature description
      description: 说明希望实现的功能和用途。 / Describe the feature and its purpose.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: 版本号 / Version
      description: 可选，填写模组版本。 / Optional, provide the mod version.
    validations: {required: false}
